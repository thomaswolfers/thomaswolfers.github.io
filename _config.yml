# ---------------------------------------------------------------
# Site settings. After changing this file, GitHub rebuilds the site
# automatically (takes ~1 minute).
# ---------------------------------------------------------------

title: Thomas Wolfers
url: https://thomaswolfers.github.io

# Google Search Console: paste the code from the "HTML tag" verification method here
# (only the content="..." value), e.g. google_site_verification: abc123
google_site_verification:

# Short description used by search engines and link previews
description:
  de: >-
    Thomas Wolfers ist Carl-Zeiss-Professor für Künstliche Intelligenz in der Bildgebung neuraler Systeme
    an der Friedrich-Schiller-Universität Jena und leitet das Laboratory for Mental Health Mapping.
  en: >-
    Thomas Wolfers holds the Carl Zeiss Endowed Professorship for Artificial Intelligence in Neural Systems
    Imaging at Friedrich Schiller University Jena and leads the Laboratory for Mental Health Mapping.

# Top menu, one list per language (in this order)
nav:
  de:
    - title: Wissenschaft
      url: /science/
    - title: Vorträge
      url: /#vortraege
    - title: Lab
      url: https://mhm-lab.github.io
  en:
    - title: Science
      url: /en/science/
    - title: Talks
      url: /en/#talks
    - title: Lab
      url: https://mhm-lab.github.io

# Links shown in the footer of every page
social:
  - title: Bluesky
    url: https://bsky.app/profile/thomaswolfers.bsky.social
  - title: LinkedIn
    url: https://www.linkedin.com/in/thomas-wolfers-5b96694b/
  - title: Google Scholar
    url: https://scholar.google.com/citations?user=4f2rdMcAAAAJ&hl=en
  - title: GitHub
    url: https://github.com/thomaswolfers
  - title: MHM Lab
    url: https://mhm-lab.github.io

# Every page uses the single layout in _layouts/default.html; German is the default language
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: de
  - scope:
      path: "en"
    values:
      lang: en

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false

exclude:
  - README.md
