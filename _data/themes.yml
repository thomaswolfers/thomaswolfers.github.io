# RESEARCH THEMES (shown as cards on the homepage and in full on the Science page)
# Each theme has a German (de) and an English (en) version.
# short: one line for the homepage card. text: the full paragraph for the Science page.

- id: foundations
  image: theme_foundations.jpg
  de:
    name: Grundlagen
    title: Grundlagen des Mental Health Mapping
    short: Was ist gesund, und was ist eine Störung?
    text: >-
      Was eine Störung ist und was als gesund oder normativ gilt, ist oft unklar. Wir erforschen die Grundlagen
      von Gesundheit, Störung und Krankheit und fragen: Was ist gesund? Welche Referenzgruppe eignet sich, um
      Krankheit zu definieren? Kann die systematische Erkundung des Geistes helfen, ihn zu verstehen? Langfristig
      trägt diese Arbeit zur theoretischen Fundierung des Mental Health Mapping bei und verbindet die Perspektive
      der ersten und der dritten Person. Wir arbeiten mit PhilosophInnen, KlinikerInnen und PatientInnen zusammen,
      die Einblicke in die Praxis geben und unsere Forschung theoretisch wie praktisch mitgestalten.
  en:
    name: Foundations
    title: Foundations of Mental Health Mapping
    short: What is healthy, and what is a disorder?
    text: >-
      What counts as a disorder, and what is healthy or normative, is often unclear. We study the foundations
      of health, disorder, and disease and ask questions such as: What is healthy? What is the right reference
      group to compare disease with? Can systematic exploration of the mind help us understand it? In the
      long run, this work contributes to the theoretical foundation of mental health mapping, incorporating
      first- and third-person perspectives. We work together with philosophers, clinicians, and patients who
      provide insights into clinical practice and inform our science in theoretical and practical ways.

- id: structures
  image: theme_structures.jpg
  de:
    name: Strukturen
    title: Strukturen des Mental Health Mapping
    short: Von der Biologie bis zu Familie und Gesellschaft.
    text: >-
      Psychische Störungen sind erblich, treten häufig gemeinsam auf und sind sehr heterogen. Manchmal liegt
      einer Erkrankung eine beeinträchtigte Biologie im Individuum zugrunde, in anderen Fällen die Dynamik
      zwischen Menschen, Gruppen oder Teilen der Gesellschaft oder Belastungen aus der Umwelt. Wir fragen: Was
      unterscheidet ein erkranktes Geschwisterkind von einem gesunden? Welche zwischenmenschlichen Faktoren
      beeinflussen die psychische Gesundheit in Familien? Wann ist es sinnvoll, Gruppen statt Einzelpersonen
      zu behandeln? Welche Rolle spielt die Gesellschaft, und welche Maßnahmen und Behandlungen verbessern die
      psychische Gesundheit? Dafür arbeiten wir mit groß angelegten Studien und kooperieren mit
      WissenschaftlerInnen und KlinikerInnen.
  en:
    name: Structures
    title: Structures of Mental Health Mapping
    short: From biology to families and society.
    text: >-
      Mental disorders are heritable, comorbid, and heterogeneous. Sometimes the structure underlying illness
      is an impaired biology within one person; in other cases it lies in the dynamics between individuals,
      groups or parts of society, or in environmental stressors. We ask questions such as: What makes one
      sibling with a disorder different from another who is healthy? What are the interpersonal factors
      contributing to mental health in families? When does it make sense to treat a group of individuals
      instead of the individual patient? What is the role of society, and which policies and treatments
      improve mental health? We work on large-scale studies that contain the data needed to answer these
      questions and collaborate with scientists and clinicians.

- id: markers
  image: theme_markers.jpg
  de:
    name: Marker
    title: Marker für das Mental Health Mapping
    short: Die verborgenen Faktoren hinter Erkrankungen.
    text: >-
      Die Ursachen psychischer Gesundheit und Krankheit sind noch wenig verstanden: Ein komplexes Zusammenspiel
      biologischer und nicht-biologischer Faktoren erzeugt bei jedem Menschen eigene Symptome. Auch deshalb
      wissen wir bisher wenig über Marker von Erkrankungen. Mit multimodalen Ansätzen versuchen wir, die
      verborgenen Faktoren aufzudecken, und fragen: Was unterscheidet zwei Menschen mit derselben Diagnose?
      Wie finden wir prädiktive Marker? Welche Datenquellen sind für welche Erkrankung besonders aussagekräftig?
      Wir kooperieren mit WissenschaftlerInnen und KlinikerInnen, die sich mit unterschiedlichen
      Krankheitsbildern beschäftigen.
  en:
    name: Markers
    title: Markers for Mental Health Mapping
    short: The hidden factors behind illness.
    text: >-
      The factors underlying mental health and disorder are not well understood: a complex web of biological
      and non-biological variables interacts to produce symptoms in each individual, which is one reason
      we know little about markers of illness. With multimodal approaches we aim to detect the hidden factors
      underlying illness, guided by questions such as: What makes one person different from another when
      diagnosed with the same disorder? How can we uncover predictive markers for illness? Which data modalities
      are informative for which disorder or disease process? We work together with scientists and clinicians
      interested in different disorders and diseases.

- id: models
  image: theme_models.jpg
  de:
    name: Modelle
    title: Modelle für das Mental Health Mapping
    short: Maschinelles Lernen, vom Labor in die Klinik.
    text: >-
      Unsere Forschung beruht zum großen Teil auf maschinellem Lernen. Wir wenden Methoden auf große Bildgebungs-,
      EEG-, Genetik-, Sensor-, Kognitions- und Verhaltensdaten an und entwickeln sie weiter. Unsere Methoden sind
      für hochdimensionale Daten und oft unzuverlässige Labels ausgelegt. Wir fragen: Wie lassen sich verschiedene
      Datenquellen mit maschinellem Lernen sinnvoll verbinden? Welche Methoden eignen sich, um Heterogenität zu
      analysieren? Welche Längsschnittmodelle passen zu unseren Daten? Wie machen wir unsere Modelle besser
      interpretierbar, und wie bringen wir maschinelles Lernen aus dem Labor in die klinische Praxis? Wir arbeiten
      mit Forschenden zusammen, die neue Methoden der Datenerhebung entwickeln, und interessieren uns für
      Methodenentwicklung (z. B. maschinelles Lernen, Statistik) sowie für gute Praxis im Umgang mit großen,
      komplexen Datensätzen.
  en:
    name: Models
    title: Models for Mental Health Mapping
    short: Machine learning, from lab to clinic.
    text: >-
      Most of our research relies on machine learning. We apply and develop methods for large-scale imaging,
      electrophysiological, genetic, sensor, cognitive, and behavioral data. Our methods are built for
      high-dimensional data and often unreliable labels. We ask questions such as: How can we use machine
      learning across modalities? What methods are best to parse heterogeneity? Which longitudinal modeling
      procedures suit the properties of the underlying data? How can we make our models more interpretable,
      and how can we take machine learning from the lab to clinical practice? We work together with scientists
      developing innovative data acquisition methods and are interested in method development (e.g., machine
      learning, statistics) as well as in best practices for curating the large, complex datasets our research
      requires.
