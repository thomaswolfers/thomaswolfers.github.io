# RESEARCH THEMES (small icons on the homepage; a click opens the text)
# Each theme has a German (de) and an English (en) version.
# name: label under the icon. title: heading when opened. text: two sentences shown when the icon is clicked.
# The full descriptions live on the lab website (mhm-lab.github.io/research/), so keep these short.

- id: foundations
  image: theme_foundations.jpg
  de:
    name: Grundlagen
    title: Grundlagen des Mental Health Mapping
    text: >-
      Was heißt eigentlich gesund, und wo beginnt eine Störung? Gemeinsam mit PatientInnen, KlinikerInnen und PhilosophInnen suchen wir nach tragfähigen Antworten.
  en:
    name: Foundations
    title: Foundations of Mental Health Mapping
    text: >-
      What does it mean to be healthy, and where does a disorder begin? Together with patients, clinicians, and philosophers, we look for answers that hold up.

- id: structures
  image: theme_structures.jpg
  de:
    name: Strukturen
    title: Strukturen des Mental Health Mapping
    text: >-
      Psychische Gesundheit entsteht zwischen Biologie, Familie und Gesellschaft. Wir untersuchen, wie diese Ebenen zusammenwirken.
  en:
    name: Structures
    title: Structures of Mental Health Mapping
    text: >-
      Mental health takes shape between biology, family, and society. We study how these levels work together.

- id: markers
  image: theme_markers.jpg
  de:
    name: Marker
    title: Marker für das Mental Health Mapping
    text: >-
      Zwei Menschen mit derselben Diagnose können sehr verschieden sein. Wir suchen nach Merkmalen, die diese Unterschiede sichtbar machen.
  en:
    name: Markers
    title: Markers for Mental Health Mapping
    text: >-
      Two people with the same diagnosis can be very different. We look for markers that make these differences visible.

- id: models
  image: theme_models.jpg
  de:
    name: Modelle
    title: Modelle für das Mental Health Mapping
    text: >-
      Wir entwickeln Methoden des maschinellen Lernens, die mit großen, komplexen Daten umgehen und den Weg in die Klinik finden.
  en:
    name: Models
    title: Models for Mental Health Mapping
    text: >-
      We develop machine learning methods that handle large, complex data and can make their way into the clinic.
